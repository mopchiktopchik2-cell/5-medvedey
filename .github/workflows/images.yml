name: Готовые образы

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Собрать amd64
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 -t 5-medvedey-backend:latest --load ./backend
          docker buildx build --platform linux/amd64 -t 5-medvedey-frontend:latest --load ./frontend
          docker save 5-medvedey-backend:latest 5-medvedey-frontend:latest | gzip -9 > 5-medvedey-images-linux-amd64.tar.gz

      - name: Собрать arm64
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 -t 5-medvedey-backend:latest --load ./backend
          docker buildx build --platform linux/arm64 -t 5-medvedey-frontend:latest --load ./frontend
          docker save 5-medvedey-backend:latest 5-medvedey-frontend:latest | gzip -9 > 5-medvedey-images-linux-arm64.tar.gz

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view images >/dev/null 2>&1; then
            gh release create images --title "Готовые образы" --notes "Образы для запуска без Docker Hub. Обновляются автоматически."
          fi
          gh release upload images 5-medvedey-images-linux-amd64.tar.gz 5-medvedey-images-linux-arm64.tar.gz --clobber
