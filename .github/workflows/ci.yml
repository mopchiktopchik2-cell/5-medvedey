name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python ../scripts/check_migrations.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Ключ только для одноразового CI-стенда, боевые данные сюда не попадают.
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Поднять LAN-стенд
        run: docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости и Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Дождаться готовности стенда
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              echo "Стенд готов"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.lan.yml ps
          docker compose -f docker-compose.yml -f docker-compose.lan.yml logs --tail=200
          exit 1

      - name: Сквозные сценарии
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Сохранить отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Логи контейнеров при падении
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.lan.yml logs --tail=200
