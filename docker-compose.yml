services:
  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/app.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  backend-data:
